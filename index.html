 // Tạo đối tượng sạch; không chép thuộc tính lạ từ JSON vào trạng thái ứng dụng.
 if(!value||typeof value!=='object'||!Array.isArray(value.lessons))throw Error('File cần có mảng lessons.');

 * Mã lượt yêu cầu ngăn kết quả tải chậm ghi đè dữ liệu mới hoặc pinyin vừa sửa tay. */
function ensurePinyin(){
 if(window.pinyinPro?.pinyin){pinyinStatus='ready';return Promise.resolve(window.pinyinPro);}
 if(pinyinPromise)return pinyinPromise;
 pinyinStatus='loading';
 pinyinPromise=new Promise((resolve,reject)=>{const script=document.createElement('script');script.src=PINYIN_URL;script.async=true;let done=false;
 const finish=ok=>{if(done)return;done=true;clearTimeout(timer);script.onload=script.onerror=null;if(ok&&window.pinyinPro?.pinyin){pinyinStatus='ready';resolve(window.pinyinPro);}else{script.remove();pinyinStatus='failed';reject(Error('Chưa tải được pinyin tự động. Bạn có thể nhập tay.'));}renderNotices();};
 const timer=setTimeout(()=>finish(false),14000);script.onload=()=>finish(true);script.onerror=()=>finish(false);document.head.append(script);
 }).finally(()=>pinyinPromise=null);return pinyinPromise;
}
function bindPinyin(root,w,onChange=()=>{}){
 const h=$('[name=hanzi]',root),p=$('[name=pinyin]',root),note=$('.pinyin-status',root);let revision=0;
 p.dataset.manual=String(w.pinyinManual??!!w.pinyin);
 const status=()=>note.textContent=p.dataset.manual==='true'?'Đã sửa tay · Không tự ghi đè':'Tự động theo cả từ · Bạn vẫn có thể sửa tay';status();
 async function generate(force=false){
  if(force)p.dataset.manual='false';const token=++revision;const text=h.value.normalize('NFC').replace(/\s/g,'');
  if(p.dataset.manual==='true'){status();return;}
  if(!text){p.value='';status();onChange();return;}if(!validHanzi(text)){note.textContent='Nhập chữ Hán hợp lệ để tạo pinyin.';return;}
  note.textContent='Đang tạo pinyin…';onChange();
  try{const lib=await ensurePinyin();const dialog=root.closest('dialog');if(token!==revision||!root.isConnected||(dialog&&!dialog.open)||p.dataset.manual==='true'||h.value.normalize('NFC').replace(/\s/g,'')!==text)return;
   p.value=lib.pinyin(text,{toneType:'symbol',type:'string'});status();onChange();
  }catch(error){if(token===revision&&root.isConnected){note.textContent=error.message;onChange();}}
 }
 p.addEventListener('input',()=>{revision++;p.dataset.manual='true';status();onChange();});
 h.addEventListener('input',e=>{revision++;if(!e.isComposing)generate();});h.addEventListener('compositionend',()=>generate());
 $('.regenerate',root).onclick=()=>generate(true);
 if(h.value&&!p.value&&p.dataset.manual!=='true')generate();
 return generate;
}
function validateWord(w){if(!validHanzi(w.hanzi))return'Hán tự phải gồm 1–20 chữ Hán, không kèm dấu câu hoặc pinyin.';if(!w.meaning.split(';').some(m=>normalizeMeaning(m)))return'Hãy nhập ít nhất một nghĩa tiếng Việt.';return null;}
function watchHanzi(input,host,onInput=()=>{}){
 let timer;const update=()=>{onInput();clearTimeout(timer);disposePreview(host);host.textContent='Đang chuẩn bị thứ tự nét…';timer=setTimeout(()=>{const dialog=host.closest('dialog');if(host.isConnected&&(!dialog||dialog.open))createPreview(host,input.value);},500);};
 input.addEventListener('input',e=>{if(!e.isComposing)update();});input.addEventListener('compositionend',update);
 if(input.value)createPreview(host,input.value);else host.textContent='Thứ tự nét sẽ xuất hiện khi nhập Hán tự.';
}
function loadDraftDay(date){const lesson=state.lessons.find(l=>l.date===date);draft={date,rows:lesson?clone(lesson.words):[],loaded:true,baseline:JSON.stringify(lesson||null)};dirty=false;}
function openDayEditor(date){if(dirty&&!confirm('Bỏ bản nháp chưa lưu để mở ngày này?'))return;loadDraftDay(date);navigate('add');}
function updateDraftCounter(){const counter=$('#draft-counter');if(counter)counter.textContent='Ngày '+formatDate(draft.date)+': '+draft.rows.length+' từ';}
function draftProblems(rows){
 const errors=[],seen=new Set();const words=[];
 rows.forEach((w,i)=>{if(![w.hanzi,w.pinyin,w.meaning,w.example].some(v=>String(v||'').trim()))return;
 const missing=[];if(!w.hanzi)missing.push('Hán tự');if(!w.meaning)missing.push('nghĩa tiếng Việt');
 if(missing.length){errors.push('Thẻ '+(i+1)+': thiếu '+missing.join(' và ')+'.');return;}
 const error=validateWord(w);if(error){errors.push('Thẻ '+(i+1)+': '+error);return;}
 if(seen.has(w.hanzi)){errors.push('Thẻ '+(i+1)+': từ “'+w.hanzi+'” đã tồn tại trong cùng ngày.');return;}seen.add(w.hanzi);words.push(w);
 });return{errors,words};
}

 '<form id="lesson-form" novalidate><div class="add-toolbar"><div class="row between"><label>Ngày học<input id="lesson-date" type="date" required value="'+esc(draft.date)+'"></label><div id="draft-counter" class="counter" role="status"></div></div><div class="row" style="margin-top:14px"><input id="quick-hanzi" class="hanzi" lang="zh-Hans" maxlength="40" aria-label="Chữ Hán cần thêm" placeholder="Nhập chữ Hán, rồi nhấn Enter…"><button type="button" id="add-word" class="primary">＋ Thêm từ</button></div><p class="tiny muted" style="margin:8px 0 0">Để trống rồi bấm Thêm từ để tạo thẻ trống. Chọn một ngày đã có để mở toàn bộ bài và thêm từ tiếp.</p></div><div id="entries"></div><div class="form-actions"><button type="button" id="clear-draft">Bỏ thay đổi chưa lưu</button><button class="primary" type="submit">Lưu bài học</button></div><div id="form-error" class="mistake" role="alert" style="white-space:pre-line;margin-top:12px"></div></form>';
 $('#lesson-date').onchange=e=>{const date=e.target.value;if(!date){e.target.value=draft.date;return;}if(dirty&&!confirm('Đổi ngày sẽ bỏ các thay đổi chưa lưu. Tiếp tục?')){e.target.value=draft.date;return;}loadDraftDay(date);cleanupPreviews();renderEntries();};
 function add(){const input=$('#quick-hanzi'),hanzi=input.value.normalize('NFC').replace(/\s/g,'');if(hanzi&&!validHanzi(hanzi)){toast('Nhập 1–20 chữ Hán, không kèm dấu câu.');return;}if(hanzi&&draft.rows.some(w=>w.hanzi===hanzi)){toast('Từ “'+hanzi+'” đã tồn tại trong cùng ngày.');return;}const w={hanzi,pinyin:'',meaning:'',example:'',pinyinManual:false};draft.rows.push(w);dirty=true;appendEntry(w);updateDraftCounter();input.value='';input.focus();}
 $('#add-word').onclick=add;$('#quick-hanzi').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing&&e.keyCode!==229){e.preventDefault();add();}});

 $('#lesson-form').onsubmit=e=>{

  if(errors.length){fail(errors.join('\n'));return;}if(!words.length){fail('Chưa có từ để lưu. Các thẻ trống hoàn toàn được bỏ qua. Để xoá cả bài, dùng Xoá ngày trong Danh sách bài học.');return;}
  if(JSON.stringify(state.lessons.find(l=>l.date===draft.date)||null)!==draft.baseline){fail('Bài học này đã thay đổi sau khi mở bản nháp. Hãy sao chép phần mới cần giữ, rồi bấm Bỏ thay đổi chưa lưu để mở dữ liệu mới nhất.');return;}
  const next=clone(state);let lesson=next.lessons.find(l=>l.date===draft.date);if(!lesson){lesson={id:uid(),date:draft.date,words:[]};next.lessons.push(lesson);}
  const removed=lesson.words.filter(w=>!words.some(x=>x.id===w.id)).length;if(removed&&!confirm('Lưu bài sẽ xoá '+removed+' từ cũ đã bỏ khỏi các thẻ. Tiếp tục?'))return;
  lesson.words=words.map(w=>({id:w.id||uid(),hanzi:w.hanzi,pinyin:w.pinyin,meaning:w.meaning,example:w.example||'',pinyinManual:!!w.pinyinManual,stats:w.stats||{correct:0,wrong:0,lastPracticed:null}}));

 };
 renderEntries();
}

// Ghép bài học từ nguồn khác vào base: thêm ngày mới, bỏ qua từ trùng ngày + Hán tự.
function mergeLessons(base,incoming){
 for(const l of incoming.lessons){let target=base.lessons.find(x=>x.date===l.date);if(!target){target={id:uid(),date:l.date,words:[]};base.lessons.push(target);}const seen=new Set(target.words.map(w=>w.hanzi));for(const w of l.words){if(!seen.has(w.hanzi)){target.words.push({...clone(w),id:uid()});seen.add(w.hanzi);}}}
 return base;
}
async function handleImport(event){
 const file=event.target.files[0];event.target.value='';if(!file)return;
 try{if(file.size>10*1024*1024)throw Error('File quá lớn. Giới hạn là 10 MB.');const imported=validateState(JSON.parse(await file.text()));
  const count=imported.lessons.reduce((n,l)=>n+l.words.length,0);
  const modal=openModal('Nhập bản sao lưu','<p><strong>'+esc(file.name)+'</strong></p><p>Đã kiểm tra: <strong>'+imported.lessons.length+' ngày · '+count+' từ</strong>.</p><div class="option-list"><label class="option"><input type="radio" name="import-mode" value="merge" checked><span><strong>Ghép thêm từ mới</strong><small>Giữ nguyên cài đặt và từ đã có. Từ trùng ngày + Hán tự sẽ được bỏ qua, kể cả thống kê từ file.</small></span></label><label class="option"><input type="radio" name="import-mode" value="replace"><span><strong>Thay thế toàn bộ</strong><small>Thay bài học, thống kê và cài đặt bằng nội dung file này.</small></span></label></div><div class="form-actions"><button id="cancel-import">Huỷ</button><button class="primary" id="confirm-import">Áp dụng</button></div><p id="import-error" class="mistake" role="alert"></p>');
  $('#cancel-import').onclick=()=>modal.close();$('#confirm-import').onclick=()=>{
   const mode=$('input[name=import-mode]:checked',modal).value;let next;
   if(mode==='replace'){if(!confirm('Thay thế toàn bộ dữ liệu hiện tại? Hãy xuất bản sao trước nếu bạn cần giữ lại.'))return;next=imported;}
   else next=mergeLessons(clone(state),imported);
   try{next=validateState(next);}catch(error){$('#import-error').textContent=error.message;return;}
   if(commit(next)){modal.close();renderSettings();toast('Đã nhập dữ liệu.');}
  };
 }catch(error){toast(error instanceof SyntaxError?'File không phải JSON hợp lệ. Dữ liệu hiện tại được giữ nguyên.':error.message);}
}

 '<details><summary>3. Cách chấm bài</summary><div><p><strong>Viết chữ Hán:</strong> Hanzi Writer đối chiếu hình dạng, hướng và thứ tự nét. Cần hoàn thành mọi chữ; mỗi chữ có số lần sai không vượt ngưỡng trong Cài đặt. Gợi ý nét xuất hiện sau 3 lần sai ở cùng một nét. Chữ có nhiều nét không được tự hoàn thành khi sai quá nhiều.</p><p><strong>Ghi nghĩa:</strong> bỏ dấu tiếng Việt, chuyển chữ thường, bỏ dấu câu và gộp khoảng trắng. Chỉ cần khớp một nghĩa hoặc chứa nguyên cụm nghĩa đã lưu. Ứng dụng không hiểu ngữ nghĩa: hãy lưu đáp án đủ cụ thể; một câu có cụm đáp án nhưng mang ý phủ định vẫn có thể được tính đúng theo quy tắc chứa cụm.</p><p><strong>Gần đúng:</strong> dùng khoảng cách Levenshtein: nghĩa dưới 4 ký tự không cho sai, 4–8 ký tự cho lệch 1, từ 9 ký tự cho lệch 2. Chỉ tính đúng sau khi bạn bấm xác nhận.</p><p><strong>Mất dữ liệu nét:</strong> không suy đoán kết quả viết tay. Chọn thử lại, loại câu khỏi lượt mà không tính điểm, hoặc Bỏ qua / Xem đáp án để tính sai.</p><p><strong>Xen kẽ:</strong> mỗi từ tạo một câu; lần lượt Loại 1, Loại 2. Luyện lại từ sai giữ dạng bài mà bạn vừa làm sai.</p><a href="https://hanziwriter.org/docs.html" target="_blank" rel="noopener noreferrer">Tài liệu Hanzi Writer ↗</a></div></details>'+
 '<details><summary>4. Sao lưu và giới hạn</summary><div><ul><li>Xuất JSON thường xuyên. Lưu trữ trong trình duyệt không phải sao lưu đám mây.</li><li>Pinyin được tạo từ cả từ bằng pinyin-pro. Chữ đa âm vẫn có thể cần sửa. Sau khi sửa tay, ứng dụng giữ nguyên pinyin cho đến khi bấm Tạo lại pinyin. Nghĩa và ví dụ do bạn nhập; ứng dụng không tự chuyển phồn thể sang giản thể.</li><li>Thêm thẻ linh hoạt, không cần nhập số lượng trước; tối đa 20 chữ Hán mỗi từ; file JSON nhập tối đa 10 MB và 20.000 từ.</li><li>Nếu trình duyệt chặn hoặc đầy localStorage, cảnh báo sẽ xuất hiện; hãy xuất JSON trước khi đóng trang.</li><li>Khi dữ liệu bị sửa ở một thẻ khác, hãy xuất công việc đang mở nếu cần rồi tải lại để tránh ghi đè.</li><li>Khi sửa từ, thống kê trước đó được giữ lại. Bản nháp chưa lưu chỉ tồn tại trong phiên đang mở.</li></ul></div></details>'+
 '<details open><summary>5. Checklist tự kiểm tra</summary><div class="checklist">'+checks.map((text,i)=>'<label class="check"><input type="checkbox"> <span>'+String(i+1).padStart(2,'0')+'. '+esc(text)+'</span></label>').join('')+'</div></details></section>';
}
/* ĐỒNG BỘ (tuỳ chọn): Firebase Auth (Google) + Firestore, một tài liệu users/{uid} chứa toàn bộ dữ liệu dạng JSON.
 * localStorage vẫn là bản chính trên máy; mỗi lần lưu sẽ ghi đè bản trên mây, máy khác nhận về qua onSnapshot. */
const deviceId=(()=>{try{let id=localStorage.getItem(DEVICE_KEY);if(!id){id=uid();localStorage.setItem(DEVICE_KEY,id);}return id;}catch{return uid();}})();
let cloud={status:FIREBASE_CONFIG?'loading':'off',user:null,api:null,ref:null,unsub:null,ready:false,pendingRemote:null,error:''};
function saveLabel(){
 if(memoryOnly)return'Chưa lưu được · Hãy xuất JSON';
 return{synced:'Đã đồng bộ',syncing:'Đang đồng bộ…',offline:'Ngoại tuyến · sẽ đồng bộ sau','pending-choice':'Chưa đồng bộ · chọn dữ liệu',error:'Lỗi đồng bộ · xem Cài đặt'}[cloud.status]||'Lưu trên trình duyệt này';
}
function setCloud(status,error=''){cloud.status=status;cloud.error=error;renderNotices();renderSyncCard();}
function cloudErrorText(error){
 const code=error?.code||'';
 if(code.includes('permission-denied'))return'Firestore từ chối quyền ghi/đọc. Kiểm tra quy tắc bảo mật trong SETUP-FIREBASE.md.';
 if(code.includes('configuration-not-found')||code.includes('operation-not-allowed'))return'Firebase chưa bật đăng nhập Google. Vào Authentication → Sign-in method → Google → Enable.';
 if(code.includes('unauthorized-domain'))return'Tên miền này chưa được thêm vào Authorized domains của Firebase Authentication.';
 if(code.includes('invalid-argument')||code.includes('resource-exhausted'))return'Dữ liệu quá lớn để đồng bộ (giới hạn khoảng 1 MB). Hãy xuất JSON để sao lưu.';
 return'Không đồng bộ được ('+(code||error?.message||'lỗi không rõ')+').';
}
async function initCloud(){
 if(!FIREBASE_CONFIG)return;
 try{
  const[appMod,authMod,fs]=await Promise.all(['firebase-app.js','firebase-auth.js','firebase-firestore.js'].map(f=>import(FIREBASE_URL+f)));
  const app=appMod.initializeApp(FIREBASE_CONFIG);
  let db;try{db=fs.initializeFirestore(app,{localCache:fs.persistentLocalCache({tabManager:fs.persistentMultipleTabManager()})});}catch{db=fs.getFirestore(app);}
  cloud.api={auth:authMod.getAuth(app),authMod,fs,db};
  authMod.onAuthStateChanged(cloud.api.auth,user=>{
   cloud.unsub?.();cloud.unsub=null;cloud.user=user;cloud.ready=false;cloud.pendingRemote=null;
   if(!user){setCloud('signed-out');return;}
   cloud.ref=fs.doc(db,'users',user.uid);setCloud(navigator.onLine?'syncing':'offline');
   cloud.unsub=fs.onSnapshot(cloud.ref,{includeMetadataChanges:true},onCloudSnapshot,error=>{console.error(error);setCloud('error',cloudErrorText(error));});
   // SDK tự thử lại mãi khi chưa tạo Firestore hoặc mạng bị chặn, nên báo lỗi sau 15 giây thay vì treo "Đang đồng bộ".
   setTimeout(()=>{if(cloud.user===user&&!cloud.ready&&navigator.onLine&&cloud.status==='syncing')setCloud('error','Chưa kết nối được Firestore sau 15 giây. Kiểm tra đã tạo Firestore Database chưa, hoặc thử tắt trình chặn quảng cáo.');},15000);
  });
 }catch(error){console.error(error);setCloud('error','Không tải được Firebase. Kiểm tra mạng hoặc FIREBASE_CONFIG.');}
}
function readRemote(snap){
 if(!snap.exists())return null;
 return validateState(JSON.parse(snap.data().data));
}
function applyRemote(remote){
 state=remote;
 try{localStorage.setItem(STORAGE_KEY,JSON.stringify(remote));memoryOnly=false;corruptRaw=null;}catch{memoryOnly=true;}
 // Không vẽ lại khi đang nhập bài hoặc đang luyện, để không mất thao tác dở.
 if(!dirty&&!(session&&!session.finished)&&!$('#modal').open)({lessons:renderLessons,settings:renderSettings}[page])?.();
}
function onCloudSnapshot(snap){
 if(snap.metadata.hasPendingWrites){setCloud(navigator.onLine?'syncing':'offline');return;}
 // Lần đầu sau đăng nhập phải đợi bản từ máy chủ, tránh ghi đè mây bằng bộ nhớ đệm trống.
 if(!cloud.ready&&snap.metadata.fromCache){setCloud(navigator.onLine?'syncing':'offline');return;}
 let remote;try{remote=readRemote(snap);}catch{setCloud('error','Dữ liệu trên mây không hợp lệ nên chưa được áp dụng. Bấm Dùng dữ liệu máy này để ghi đè.');cloud.pendingRemote=defaultState();return;}
 if(!cloud.ready){
  if(!remote||!remote.lessons.length){cloud.ready=true;cloudPush();return;}
  if(!state.lessons.length||JSON.stringify(remote)===JSON.stringify(state)){cloud.ready=true;applyRemote(remote);setCloud('synced');return;}
  cloud.pendingRemote=remote;setCloud('pending-choice');askReconcile();return;
 }
 if(remote&&JSON.stringify(remote)!==JSON.stringify(state)){applyRemote(remote);toast('Đã cập nhật dữ liệu từ thiết bị khác.');}
 setCloud(snap.metadata.fromCache&&!navigator.onLine?'offline':'synced');
}
function cloudPush(){
 if(!cloud.user||!cloud.ready)return;
 const{fs}=cloud.api;
 fs.setDoc(cloud.ref,{data:JSON.stringify(state),updatedAt:fs.serverTimestamp(),device:deviceId}).catch(error=>{console.error(error);setCloud('error',cloudErrorText(error));});
}
function askReconcile(){
 const remote=cloud.pendingRemote;if(!remote)return;
 const summary=s=>s.lessons.length+' ngày · '+s.lessons.reduce((n,l)=>n+l.words.length,0)+' từ';
 const modal=openModal('Chọn dữ liệu để đồng bộ','<p>Máy này và tài khoản <strong>'+esc(cloud.user?.email||'')+'</strong> đang có dữ liệu khác nhau.</p><p>Máy này: <strong>'+summary(state)+'</strong><br>Trên mây: <strong>'+summary(remote)+'</strong></p><div class="option-list"><label class="option"><input type="radio" name="sync-mode" value="merge" checked><span><strong>Ghép cả hai</strong><small>Giữ mọi ngày học; từ trùng ngày + Hán tự lấy theo máy này.</small></span></label><label class="option"><input type="radio" name="sync-mode" value="cloud"><span><strong>Dùng dữ liệu trên mây</strong><small>Thay dữ liệu máy này bằng bản trên mây.</small></span></label><label class="option"><input type="radio" name="sync-mode" value="local"><span><strong>Dùng dữ liệu máy này</strong><small>Ghi đè bản trên mây bằng dữ liệu máy này.</small></span></label></div><div class="form-actions"><button id="cancel-sync">Để sau</button><button class="primary" id="confirm-sync">Đồng bộ</button></div>');
 $('#cancel-sync').onclick=()=>modal.close();
 $('#confirm-sync').onclick=()=>{
  const mode=$('input[name=sync-mode]:checked',modal).value;
  if(mode!=='merge'&&!confirm(mode==='cloud'?'Thay toàn bộ dữ liệu máy này bằng bản trên mây?':'Ghi đè toàn bộ bản trên mây bằng dữ liệu máy này?'))return;
  cloud.ready=true;cloud.pendingRemote=null;modal.close();setCloud('syncing');
  if(mode==='cloud'){applyRemote(remote);setCloud('synced');navigate(page);}
  else if(mode==='local')cloudPush();
  else if(commit(mergeLessons(clone(state),remote)))navigate(page);
  toast('Đã bật đồng bộ.');
 };
}
async function cloudSignIn(){
 const{auth,authMod}=cloud.api;const provider=new authMod.GoogleAuthProvider();
 try{await authMod.signInWithPopup(auth,provider);}
 catch(error){
  if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment'].includes(error.code)){try{await authMod.signInWithRedirect(auth,provider);}catch(e){toast(cloudErrorText(e));}}
  else if(!['auth/popup-closed-by-user','auth/cancelled-popup-request'].includes(error.code))toast(cloudErrorText(error));
 }
}
async function cloudSignOut(){
 if(!confirm('Đăng xuất? Dữ liệu vẫn còn trên máy này nhưng sẽ không đồng bộ nữa.'))return;
 await cloud.api.authMod.signOut(cloud.api.auth);toast('Đã đăng xuất.');
}
function renderSyncCard(){
 const card=$('#sync-card');if(!card)return;
 let body;
 if(!FIREBASE_CONFIG)body='<p class="muted">Chưa bật. Dán cấu hình Firebase vào hằng <code>FIREBASE_CONFIG</code> trong <code>index.html</code> theo hướng dẫn <code>SETUP-FIREBASE.md</code>.</p>';
 else if(cloud.status==='loading')body='<p class="muted">Đang tải công cụ đồng bộ…</p>';
 else if(!cloud.user)body='<p class="muted">Đăng nhập cùng một tài khoản Google trên PC và điện thoại để dùng chung bài học. Dữ liệu vẫn được giữ trên máy khi mất mạng.</p>'+(cloud.error?'<p class="mistake tiny">'+esc(cloud.error)+'</p>':'')+(cloud.api?'<button class="primary" id="sync-signin">Đăng nhập bằng Google</button>':'');
 else body='<p>Tài khoản: <strong>'+esc(cloud.user.email||cloud.user.displayName||'')+'</strong><br><span class="muted">Trạng thái: '+esc(saveLabel())+'</span></p>'+(cloud.error?'<p class="mistake tiny">'+esc(cloud.error)+'</p>':'')+'<div class="row">'+(cloud.pendingRemote?'<button class="primary" id="sync-choose">Chọn dữ liệu đồng bộ</button>':'')+'<button id="sync-signout">Đăng xuất</button></div>';
 card.innerHTML='<h2>Đồng bộ PC & điện thoại</h2>'+body;
 $('#sync-signin')?.addEventListener('click',cloudSignIn);$('#sync-signout')?.addEventListener('click',cloudSignOut);$('#sync-choose')?.addEventListener('click',askReconcile);
}
/* KHỞI ĐỘNG: giao diện dùng được ngay cả khi CDN không phản hồi. */
$('#today-label').textContent=new Intl.DateTimeFormat('vi-VN',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date());
$$('nav button').forEach(button=>button.onclick=()=>navigate(button.dataset.page));
$('#quick-export').onclick=exportJSON;
$('#sync-button').onclick=()=>cloud.status==='pending-choice'?askReconcile():cloudSignIn();
window.addEventListener('online',renderNotices);window.addEventListener('offline',renderNotices);
window.addEventListener('beforeunload',event=>{if(dirty||memoryOnly||(session&&!session.finished)){event.preventDefault();event.returnValue='';}});
window.addEventListener('storage',event=>{if(event.key===STORAGE_KEY||event.key===null){externalConflict=true;renderNotices();}});
renderLessons();renderNotices();initCloud();ensureWriter().catch(()=>{});ensurePinyin().catch(()=>{});
</script>
