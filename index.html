function pinyinRules(){return '<details class="rules"><summary>Quy tắc pinyin và thanh điệu</summary><div><p>Kiểu B chỉ cần gõ chữ cái. Kiểu A cần đúng thanh điệu, gõ dấu hoặc số đều được.</p><p><b>4 thanh và thanh nhẹ:</b> mā (1, ngang cao), má (2, lên), mǎ (3, xuống rồi lên), mà (4, xuống), ma (nhẹ, không dấu).</p><ol><li>Có a hoặc e: đặt trên a trước, rồi e — hǎo, xiè.</li><li>ou: đặt trên o — zǒu.</li><li>Còn lại: nguyên âm đứng sau — iu → u (liú), ui → i (guì), uo → o (duō).</li><li>i có dấu thì bỏ chấm — nǐ, shì.</li><li>ü giữ sau n/l (nǚ, lǜ); sau j/q/x/y viết u (jù, qù, xué, yuǎn).</li></ol><p>Gõ v hoặc u: để có ü. Số 1–4 là thanh; 5/0 là thanh nhẹ. Có thể gõ liền hoặc cách âm tiết.</p><p>Biến điệu chỉ là cách đọc. Ví dụ nǐ hǎo vẫn viết thanh gốc 3 + 3.</p></div></details>';}

let writerStatus='idle',writerPromise=null;

  const script=document.createElement('script');script.src=WRITER_URL;script.async=true;let done=false;
  const finish=ok=>{if(done)return;done=true;clearTimeout(timer);script.onload=script.onerror=null;if(ok&&window.HanziWriter){writerStatus='ready';resolve(window.HanziWriter);}else{script.remove();writerStatus='failed';reject(Error('Không tải được thư viện viết tay.'));}renderNotices();};
  const timer=setTimeout(()=>finish(false),14000);script.onload=()=>finish(true);script.onerror=()=>finish(false);document.head.append(script);

function getStrokeData(char){

  const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),11000);
  try{const response=await fetch(DATA_URL+encodeURIComponent(char)+'.json',{signal:controller.signal});
   if(response.status===404)throw Error('Chưa có dữ liệu nét cho chữ này.');
   if(!response.ok)throw Error('Không tải được dữ liệu nét. Hãy kiểm tra mạng.');
   const data=await response.json();if(!Array.isArray(data.strokes)||!data.strokes.length||!Array.isArray(data.medians)||data.medians.length!==data.strokes.length)throw Error('Dữ liệu nét không hợp lệ.');return data;
  }catch(e){if(e.name==='AbortError')throw Error('Tải nét quá lâu. Hãy thử lại.');if(e instanceof TypeError)throw Error('Không tải được nét. Hãy kiểm tra mạng.');throw e;}finally{clearTimeout(timer);}

function refreshDuplicateWarnings(){
 if($$('#entries > .entry').some(r=>r._composing))return;
 $$('#entries > .entry').forEach(row=>{const text=$('[name=hanzi]',row).value.trim();if(row._dupText!==text){row._dupText=text;row._dupConfirmed=false;}
 const matches=duplicateMatches(row);row._duplicates=matches;let box=$('.duplicate-warning',row);if(!matches.length){box?.remove();row._dupSignature='';return;}
 const signature=JSON.stringify([text,matches,!!row._dupConfirmed]);if(signature===row._dupSignature)return;row._dupSignature=signature;if(!box){box=document.createElement('div');box.className='duplicate-warning';row.append(box);}box.className='duplicate-warning notice '+(row._dupConfirmed?'confirmed':'');
 box.innerHTML='<strong>'+ (row._dupConfirmed?'Đã xác nhận thêm trùng':'Từ '+esc(text)+' đã có rồi')+'</strong><ul>'+matches.slice(0,5).map(m=>'<li>'+esc(m.label)+' (pinyin: '+esc(m.pinyin||'chưa có')+', nghĩa: '+esc(m.meaning)+')</li>').join('')+'</ul>'+(matches.length>5?'<p>và '+(matches.length-5)+' nơi khác</p>':'')+'<p>Bạn có muốn thêm từ này tiếp không?</p><div class="row"><label class="check"><input type="checkbox" class="confirm-duplicate" '+(row._dupConfirmed?'checked':'')+'>Có, vẫn thêm</label><button type="button" class="small danger delete-duplicate">Xoá thẻ này</button></div>';
 $('.confirm-duplicate',box).onchange=e=>{row._dupConfirmed=e.target.checked;refreshDuplicateWarnings();};$('.delete-duplicate',box).onclick=()=>$('.remove-entry',row).click();
 });
}
function bindDuplicateWarning(row){const h=$('[name=hanzi]',row);row._dupText=h.value.trim();row._dupConfirmed=false;row._composing=false;
 const later=()=>{clearTimeout(duplicateTimer);if(!row._composing)duplicateTimer=setTimeout(refreshDuplicateWarnings,500);};
 h.addEventListener('compositionstart',()=>{row._composing=true;clearTimeout(duplicateTimer);});h.addEventListener('compositionend',()=>{row._composing=false;row._dupConfirmed=false;later();});
 h.addEventListener('input',()=>{row._dupConfirmed=false;later();});h.addEventListener('blur',()=>{if(!row._composing){clearTimeout(duplicateTimer);refreshDuplicateWarnings();}});
}
function validateDraftDuplicates(){
 if($$('#entries > .entry').some(r=>r._composing)){toast('Hãy hoàn tất nhập chữ Hán trước khi lưu.');return false;}clearTimeout(duplicateTimer);refreshDuplicateWarnings();
 const blocked=$$('#entries > .entry').filter(r=>r._duplicates?.length&&!r._dupConfirmed);if(!blocked.length)return true;
 $('#form-error').textContent='Chưa xác nhận từ trùng: '+blocked.map(r=>'thẻ '+($$('#entries > .entry').indexOf(r)+1)+' ('+$('[name=hanzi]',r).value.trim()+')').join(', ')+'. Hãy tích Có, vẫn thêm hoặc xoá thẻ.';scrollSection(blocked[0]);return false;
}

function bindRich(root){
 $$('.rich-wrap',root).forEach(wrap=>{if(wrap._bound)return;wrap._bound=true;const input=$('[contenteditable]',wrap);
 const refresh=()=>$$('[data-format]',wrap).forEach(b=>{try{b.setAttribute('aria-pressed',String(document.queryCommandState(b.dataset.format)));}catch{}});
 const format=command=>{input.focus();document.execCommand(command,false);input.dispatchEvent(new Event('input',{bubbles:true}));refresh();};
 $$('[data-format]',wrap).forEach(b=>{b.onpointerdown=e=>e.preventDefault();b.onmousedown=e=>e.preventDefault();b.onclick=()=>format(b.dataset.format);});input.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['b','i'].includes(e.key.toLowerCase())){e.preventDefault();format(e.key.toLowerCase()==='b'?'bold':'italic');}});
 input.addEventListener('paste',e=>{e.preventDefault();const text=e.clipboardData.getData('text/plain');document.execCommand('insertText',false,text);input.dispatchEvent(new Event('input',{bubbles:true}));});input.addEventListener('drop',e=>e.preventDefault());input.addEventListener('blur',()=>{const clean=sanitizeRich(input.innerHTML);if(clean!==input.innerHTML){input.innerHTML=clean;input.dispatchEvent(new Event('input',{bubbles:true}));}});input.addEventListener('keyup',refresh);input.addEventListener('mouseup',refresh);input.addEventListener('focus',refresh);
 });
}

function bindSenses(root,onChange=()=>{}){

/* Truyền cả từ cho pinyin-pro để thư viện phân giải chữ đa âm theo ngữ cảnh.
 * Một khi sửa pinyin bằng tay, khoá tự động được lưu cùng từ; chỉ nút tạo lại mở khoá.
 * Mã lượt yêu cầu ngăn kết quả tải chậm ghi đè dữ liệu mới hoặc pinyin vừa sửa tay. */
function ensurePinyin(){
 if(window.pinyinPro?.pinyin){pinyinStatus='ready';return Promise.resolve(window.pinyinPro);}
 if(pinyinPromise)return pinyinPromise;
 pinyinStatus='loading';
 pinyinPromise=new Promise((resolve,reject)=>{const script=document.createElement('script');script.src=PINYIN_URL;script.async=true;let done=false;
 const finish=ok=>{if(done)return;done=true;clearTimeout(timer);script.onload=script.onerror=null;if(ok&&window.pinyinPro?.pinyin){pinyinStatus='ready';resolve(window.pinyinPro);}else{script.remove();pinyinStatus='failed';reject(Error('Chưa tải được pinyin tự động. Bạn có thể nhập tay.'));}renderNotices();};
 const timer=setTimeout(()=>finish(false),14000);script.onload=()=>finish(true);script.onerror=()=>finish(false);document.head.append(script);
 }).finally(()=>pinyinPromise=null);return pinyinPromise;
}
function bindPinyin(root,w,onChange=()=>{}){
 const h=$('[name=hanzi]',root),p=$('[name=pinyin]',root),note=$('.pinyin-status',root);let revision=0;
 p.dataset.manual=String(w.pinyinManual??!!w.pinyin);
 const status=()=>note.textContent=p.dataset.manual==='true'?'Đã sửa tay · Không tự ghi đè':'Tự động theo cả từ · Bạn vẫn có thể sửa tay';status();
 async function generate(force=false){
  if(force)p.dataset.manual='false';const token=++revision;const text=h.value.normalize('NFC').replace(/\s/g,'');
  if(p.dataset.manual==='true'){status();return;}
  if(!text){p.value='';status();onChange();return;}if(!validHanzi(text)){note.textContent='Nhập chữ Hán hợp lệ để tạo pinyin.';return;}
  note.textContent='Đang tạo pinyin…';onChange();
  try{const lib=await ensurePinyin();const dialog=root.closest('dialog');if(token!==revision||!root.isConnected||(dialog&&!dialog.open)||p.dataset.manual==='true'||h.value.normalize('NFC').replace(/\s/g,'')!==text)return;
   p.value=lib.pinyin(text,{toneType:'symbol',type:'string'});status();onChange();
  }catch(error){if(token===revision&&root.isConnected){note.textContent=error.message;onChange();}}
 }
 p.addEventListener('input',()=>{revision++;p.dataset.manual='true';status();onChange();});
 h.addEventListener('input',e=>{revision++;if(!e.isComposing)generate();});h.addEventListener('compositionend',()=>generate());
 $('.regenerate',root).onclick=()=>generate(true);
 if(h.value&&!p.value&&p.dataset.manual!=='true')generate();
 return generate;
}
function validateWord(w){if(!validHanzi(w.hanzi))return'Hán tự phải gồm 1–20 chữ Hán, không kèm dấu câu hoặc pinyin.';try{validateSenses(w);}catch(error){return error.message;}return null;}

 input.addEventListener('input',e=>{if(!e.isComposing)update();});input.addEventListener('compositionend',update);
 if(input.value)createPreview(host,input.value);else host.textContent='Thứ tự nét sẽ xuất hiện khi nhập Hán tự.';
}
function loadDraftDay(date){const lesson=state.lessons.find(l=>l.date===date);draft={date,rows:lesson?clone(lesson.words):[],name:lesson?.name||'',loaded:true,baseline:JSON.stringify(lesson||null),confirmedRemovedIds:[]};dirty=false;}

function draftProblems(rows){
 const errors=[];const words=[];
 rows.forEach((w,i)=>{if(![w.hanzi,w.pinyin,...sensesOf(w).flatMap(s=>[s.meaning,richText(s.example)]),richText(w.note||'')].some(v=>String(v||'').trim()))return;
 const missing=[];if(!w.hanzi)missing.push('Hán tự');
 if(missing.length){errors.push('Thẻ '+(i+1)+': thiếu '+missing.join(' và ')+'.');return;}
 const error=validateWord(w);if(error){errors.push('Thẻ '+(i+1)+': '+error);return;}
 words.push(w);
 });return{errors,words};
}

  const next=clone(state);let lesson=next.lessons.find(l=>l.date===draft.date);if(!lesson){lesson={id:uid(),date:draft.date,words:[]};next.lessons.push(lesson);}
  const removed=lesson.words.filter(w=>!words.some(x=>x.id===w.id)&&!(draft.confirmedRemovedIds||[]).includes(w.id)).length;if(removed&&!confirm('Lưu bài sẽ xoá '+removed+' từ cũ đã bỏ khỏi các thẻ. Tiếp tục?'))return;

function scheduleTasks(tasks,randomize=false){

 const buckets=[...groups.values()];if(randomize){shuffle(buckets);buckets.forEach((b,i)=>{b.rank=i;shuffle(b.tasks);});}
 // Chỉ chọn bước vẫn cho phép phần còn lại tránh hai câu cùng từ liên tiếp.
 const queue=[];let remaining=tasks.length;while(remaining){let candidates=buckets.filter(b=>b.tasks.length),nonAdjacent=candidates.filter(b=>queue.at(-1)?.word.id!==b.id);if(nonAdjacent.length)candidates=nonAdjacent;
 const feasible=candidates.filter(chosen=>buckets.every(b=>b.tasks.length-(b===chosen?1:0)<=(b===chosen?Math.floor((remaining-1)/2):Math.ceil((remaining-1)/2))));if(feasible.length)candidates=feasible;
 const gap=Math.min(3,buckets.length-1),spaced=candidates.filter(b=>queue.length-b.last>gap);if(spaced.length)candidates=spaced;
 candidates.sort((a,b)=>b.tasks.length-a.tasks.length||a.last-b.last||a.rank-b.rank);const chosen=candidates[0];queue.push(chosen.tasks.shift());chosen.last=queue.length-1;remaining--;}

/* Các thẻ trùng chữ là dữ liệu hợp lệ. Ghép theo ID, không khử trùng theo Hán tự. */
function mergeImportedState(current,imported){
 const next=clone(current),used=new Set(next.lessons.flatMap(l=>[l.id,...l.words.map(w=>w.id)]));
 for(const l of imported.lessons){let target=next.lessons.find(x=>x.date===l.date);if(!target){let id=l.id;if(used.has(id))id=uid();used.add(id);target={id,date:l.date,name:l.name||'',words:[]};next.lessons.push(target);}const existing=new Set(target.words.map(w=>w.id));
 for(const w of l.words){if(existing.has(w.id))continue;let id=w.id;if(used.has(id))id=uid();used.add(id);target.words.push({...clone(w),id});existing.add(id);}}
 return next;
}

  $('#cancel-import').onclick=()=>modal.close();$('#confirm-import').onclick=()=>{
   const mode=$('input[name=import-mode]:checked',modal).value;let next;
   if(mode==='replace'){if(!confirm('Thay thế toàn bộ dữ liệu hiện tại? Hãy xuất bản sao trước nếu bạn cần giữ lại.'))return;next=imported;}
   else{next=mergeImportedState(state,imported);}

}

 'Đặt ngưỡng thành 2 thì sai lần 2 mới hiện đáp án; tự đọc chỉ phát khi đáp án thực sự hiện.'
 ];
 $('#main').innerHTML=heading('Hướng dẫn và tự kiểm tra','Học theo nhịp của bạn.','Ứng dụng một file, dữ liệu lưu trên trình duyệt này.')+'<section class="card help"><details open><summary>Xuất từ theo ngày và luyện câu</summary><div><p>Trong Danh sách bài học, bấm Xuất từ theo ngày, chọn các ngày rồi chọn PDF A4 ngang. Bản PDF có chữ Hán, pinyin, toàn bộ nghĩa và ví dụ, không có thống kê hoặc nút thao tác. Vẫn có HTML, CSV và JSON; JSON dùng để nhập lại đầy đủ dữ liệu.</p><p>Nhập câu Trung trong các ô Ví dụ. Ứng dụng tự lọc theo hệ chữ, bỏ ghi chú Việt và pinyin, tự dịch và đưa tất cả câu vào Loại 4. Bạn được sửa câu Trung, sửa đề Việt hoặc xoá câu khỏi bài luyện trong thẻ từ, và qua nút Xem / sửa câu trước khi luyện. Xoá câu cần xác nhận một lần. Câu bị loại hẳn khỏi danh sách, không có nút khôi phục và không tự thêm lại khi lọc Ví dụ. Chỉnh sửa không thay đổi nội dung Ví dụ. Bấm Lưu bài học / Lưu chỉnh sửa để lưu. Những câu trùng hoàn toàn trong cùng từ chỉ hỏi một lần. Câu đã xoá khỏi Ví dụ không còn thi nhưng bản dịch cũ vẫn được giữ. Câu trộn chữ Latin có thể bị tách thành các đoạn; nên đặt câu Trung trên dòng riêng.</p><p>Loại 4: nhìn đề tiếng Việt, dùng bộ gõ pinyin của thiết bị để nhập câu bằng chữ Hán vào ô đáp án, không viết tay. Chấm đúng theo câu gốc, không phân biệt dấu câu và khoảng trắng; chưa chấm các cách diễn đạt tiếng Trung khác nghĩa tương đương. Sai chưa đủ ngưỡng không lộ đáp án; đúng hoặc đủ ngưỡng mới hiện. Đáp án câu có pinyin tự tạo theo cả câu. Điểm chỉ tính lần đầu, có thể nhập lại không giới hạn sau khi hiện đáp án. Ở mọi dạng, nhấn Enter lần nữa khi đáp án đã hiện để sang câu tiếp theo (câu cuối sẽ mở kết quả). Nếu sửa ô trả lời để luyện thêm, Enter chấm lại trước; nhấn Enter tiếp để chuyển. Giữ phím hoặc Enter khi đang chọn chữ bằng bộ gõ không chuyển câu.</p><p>Câu chưa có bản dịch được gửi đến MyMemory qua mạng; dịch máy có thể chưa tự nhiên hoặc chưa đúng ngữ cảnh. Bản dịch đã lưu vẫn dùng được khi ngoại tuyến. Nếu dịch lỗi hoặc hết hạn mức, bài tập sẽ báo câu còn thiếu và cho thử lại, không âm thầm bỏ câu. Bạn có thể tự sửa đề Việt hoặc xoá câu lỗi trước khi luyện. Xuất PDF cần tải pdf-lib 1.17.1 lần đầu; nếu mất mạng hãy thử lại khi có kết nối.</p><p>File không nhúng từ cá nhân. Sổ mới ban đầu trống, chỉ có từ sau khi bạn nhập hoặc chủ động bấm Thử 5 từ mẫu. Cài đặt có nút tải sổ trước và xoá toàn bộ sổ hiện tại kèm bản sao.</p></div></details><details open><summary>Cách chạy và cập nhật</summary><div><p>Lưu file thành index.html và double-click trên máy tính. Bản này khởi tạo sổ trống riêng. Sau khi bạn bắt đầu nhập từ vào sổ mới, các lần mở lại tại cùng vị trí và cùng trình duyệt vẫn giữ những từ đó. Sổ trước có thể tải JSON trong Cài đặt. Xuất JSON trước khi chuyển thiết bị, rồi nhập ở nơi mới.</p><p>GitHub Pages: tải index.html vào gốc repository và commit. Vào Settings → Pages, chọn Deploy from a branch, chọn nhánh chứa file và /(root), rồi Save. Khi cập nhật, thay file và commit. Mỗi thiết bị giữ dữ liệu riêng.</p></div></details><details><summary>Bài học, tìm kiếm và từ trùng</summary><div><p>Mỗi ngày ban đầu thu gọn. Bấm tiêu đề để mở/đóng, có thể mở nhiều ngày. Tìm kiếm tự mở các ngày có từ khớp; xoá tìm kiếm phục hồi trạng thái trước đó. Ngày vừa lưu được mở sẵn.</p><p>Thêm từ sẽ chèn sau thẻ đang làm việc. Cảnh báo trùng xét các ngày đã lưu và các thẻ đang nhập, chỉ kiểm tra sau khi hoàn tất gõ. Các thao tác xoá từ, ngày, thẻ, nghĩa/ví dụ, câu luyện và toàn bộ sổ đều hỏi xác nhận trước khi xoá. Bấm Huỷ sẽ giữ nguyên. Thẻ đã xác nhận xoá không bị hỏi lại khi Lưu bài học. Muốn giữ thẻ trùng, tích Có, vẫn thêm ở từng thẻ bị cảnh báo. Đổi chữ Hán sẽ yêu cầu xác nhận lại. Khi mở lại bài đã có các thẻ trùng, các thẻ đó có thể cần xác nhận lại trước khi lưu.</p></div></details><details><summary>Nghĩa, điểm và lúc hiện đáp án</summary><div><p>Mỗi cặp Nghĩa là một nghĩa riêng. Dấu phẩy/chấm phẩy tách các cách diễn đạt đồng nghĩa. Chú thích trong ngoặc không bắt buộc; nếu toàn bộ nghĩa nằm trong ngoặc thì dùng chữ bên trong. Mọi phần bạn gõ phải khớp, không phân biệt dấu tiếng Việt hay hoa thường. Gần đúng cần bạn xác nhận.</p><p>Loại 2 nhiều nghĩa cho trả lời theo mọi thứ tự, hoặc nhiều nghĩa một lượt. Lặp nghĩa cũ không phạt. Đúng một nghĩa thì bộ đếm sai của lượt sau về 0; sai đủ ngưỡng trong một lượt sẽ hiện tất cả nghĩa còn lại và kết thúc từ. Một lần sai bất kỳ khiến kết quả của từ là sai.</p><p>Lần thử đầu tiên quyết định điểm. Sai chưa đủ ngưỡng chỉ có thông báo và Thử lại. Đúng, sai đủ ngưỡng, hoặc bấm Bỏ qua mới hiện đáp án. Mặc định 3 lần sai, chỉnh từ 1 đến 10 trong Cài đặt. Đúng sau lần đầu sai không đổi điểm. Khi đáp án đã hiện, luyện lại không giới hạn và không ghi thêm điểm.</p><p>Loại 1 hiện toàn bộ nghĩa, không hiện ví dụ. Một lần sai là viết xong cả từ và vượt ngưỡng nét sai mỗi chữ. Kèm pinyin mặc định tắt. Nếu bật, hai phần có bộ đếm riêng: phần nào đúng hoặc đủ ngưỡng mới hiện đáp án phần đó; phần đúng được khoá lại. Chỉ sang câu tiếp khi cả hai phần đã hoàn tất hoặc bấm Bỏ qua.</p><p>Loại 3 luôn cho chữ Hán và nghĩa: A cần thanh điệu (dấu hoặc số); B không cần thanh điệu, vẫn phải có r hoá âm. B chấp nhận u thay ü và nhắc cách viết chuẩn. Từ thiếu pinyin bỏ qua phần pinyin. Lựa chọn ở màn thiết lập chỉ áp dụng cho lượt đó, trừ khi tích Nhớ lựa chọn này.</p><p>Luyện tất cả tạo đủ các dạng đã chọn cho mỗi từ và tách các câu cùng từ khi có thể. Ôn những phần hay sai lọc theo ngày và dạng đã chọn, yêu cầu ít nhất 2 lần sai và tỷ lệ sai từ 50% trở lên; khi giới hạn số từ, ưu tiên tỷ lệ sai cao rồi số lần sai nhiều. Thống kê câu cũ chưa tách riêng dùng thống kê Gõ câu của từ; từ lần luyện mới theo dõi riêng từng câu. Luyện lại chỉ chọn các dạng có kết quả sai. Tiến độ câu và bộ đếm thuộc lượt đang mở; thống kê được lưu.</p></div></details><details><summary>Âm thanh và định dạng</summary><div><p>Nút 🔊 dùng giọng Chinese (Mandarin) của thiết bị, không cần key. Nếu thiếu giọng, cài thêm trong cài đặt ngôn ngữ/giọng nói. Chỉ đọc khi bấm nút, hoặc khi đáp án hiện nếu bạn bật Tự đọc khi hiện đáp án. Không tự đọc ở các lần sai còn ẩn đáp án.</p><p>Ví dụ/Ghi chú hỗ trợ B, I và Ctrl/Cmd+B, Ctrl/Cmd+I. Dán chỉ giữ chữ thuần; lưu HTML sạch với b/i/br. Che từ bằng x*** vẫn giữ định dạng.</p></div></details>'+pinyinRules()+'<details><summary>Bảo toàn dữ liệu</summary><div><p>Sổ mới dùng vùng lưu riêng và ban đầu không có từ. Sổ trước vẫn có thể tải JSON trong Cài đặt. schemaVersion 3 chuyển dữ liệu cũ và đặt Kèm pinyin về tắt một lần; các lần lưu sau tôn trọng lựa chọn của bạn. Trước lần ghi chuyển đổi có bản sao dữ liệu gốc. Thống kê correct/wrong cũ giữ ở legacy; stats.tone giữ trong JSON nhưng không dùng trên giao diện.</p><p>Nhập ghép giữ bản hiện có khi trùng ID trong cùng ngày; các thẻ khác ID được giữ kể cả trùng chữ Hán. Nhập thay thế cần xác nhận. Dữ liệu không hợp lệ không ghi đè dữ liệu hiện tại. Nếu trình duyệt không lưu được, Xuất JSON trước khi đóng trang.</p></div></details><details open><summary>Checklist tự kiểm tra</summary><div class="checklist">'+checks.map((x,i)=>'<label class="check"><input type="checkbox"><span>'+(i+1)+'. '+esc(x)+'</span></label>').join('')+'</div></details></section>';

/* ĐỒNG BỘ (tuỳ chọn): Firebase Auth (Google) + Firestore, một tài liệu users/{uid}; sổ v3 nằm ở trường dataV3 (trường data cũ của sổ trước được giữ nguyên).
 * localStorage vẫn là bản chính trên máy; mỗi lần lưu sẽ ghi đè bản trên mây, máy khác nhận về qua onSnapshot. */
const deviceId=(()=>{try{let id=localStorage.getItem(DEVICE_KEY);if(!id){id=uid();localStorage.setItem(DEVICE_KEY,id);}return id;}catch{return uid();}})();
let cloud={status:FIREBASE_CONFIG?'loading':'off',user:null,api:null,ref:null,unsub:null,ready:false,error:''};
function saveLabel(){
 if(memoryOnly)return'Chưa lưu được · Hãy xuất JSON';
 return{synced:'Đã đồng bộ',syncing:'Đang đồng bộ…',offline:'Ngoại tuyến · sẽ đồng bộ sau',error:'Lỗi đồng bộ · xem Cài đặt'}[cloud.status]||'Lưu trên trình duyệt này';
}
function setCloud(status,error=''){cloud.status=status;cloud.error=error;renderNotices();renderSyncCard();}
function cloudErrorText(error){
 const code=error?.code||'';
 if(code.includes('permission-denied'))return'Firestore từ chối quyền ghi/đọc. Kiểm tra quy tắc bảo mật trong SETUP-FIREBASE.md.';
 if(code.includes('configuration-not-found')||code.includes('operation-not-allowed'))return'Firebase chưa bật đăng nhập Google. Vào Authentication → Sign-in method → Google → Enable.';
 if(code.includes('unauthorized-domain'))return'Tên miền này chưa được thêm vào Authorized domains của Firebase Authentication.';
 if(code.includes('invalid-argument')||code.includes('resource-exhausted'))return'Dữ liệu quá lớn để đồng bộ (giới hạn khoảng 1 MB). Hãy xuất JSON để sao lưu.';
 return'Không đồng bộ được ('+(code||error?.message||'lỗi không rõ')+').';
}
async function initCloud(){
 if(!FIREBASE_CONFIG)return;
 try{
  const[appMod,authMod,fs]=await Promise.all(['firebase-app.js','firebase-auth.js','firebase-firestore.js'].map(f=>import(FIREBASE_URL+f)));
  const app=appMod.initializeApp(FIREBASE_CONFIG);
  let db;try{db=fs.initializeFirestore(app,{localCache:fs.persistentLocalCache({tabManager:fs.persistentMultipleTabManager()})});}catch{db=fs.getFirestore(app);}
  cloud.api={auth:authMod.getAuth(app),authMod,fs,db};
  authMod.onAuthStateChanged(cloud.api.auth,user=>{
   cloud.unsub?.();cloud.unsub=null;cloud.user=user;cloud.ready=false;
   if(!user){setCloud('signed-out');return;}
   cloud.ref=fs.doc(db,'users',user.uid);setCloud(navigator.onLine?'syncing':'offline');
   cloud.unsub=fs.onSnapshot(cloud.ref,{includeMetadataChanges:true},onCloudSnapshot,error=>{console.error(error);setCloud('error',cloudErrorText(error));});
   // SDK tự thử lại mãi khi chưa tạo Firestore hoặc mạng bị chặn, nên báo lỗi sau 15 giây thay vì treo "Đang đồng bộ".
   setTimeout(()=>{if(cloud.user===user&&!cloud.ready&&navigator.onLine&&cloud.status==='syncing')setCloud('error','Chưa kết nối được Firestore sau 15 giây. Kiểm tra đã tạo Firestore Database chưa, hoặc thử tắt trình chặn quảng cáo.');},15000);
  });
 }catch(error){console.error(error);setCloud('error','Không tải được Firebase. Kiểm tra mạng hoặc FIREBASE_CONFIG.');}
}
function readRemote(snap){
 const raw=snap.exists()?snap.data().dataV3:null;if(!raw)return null;
 return validateState(JSON.parse(raw));
}
// Sổ của bản app trước (trường data). Chỉ dùng ở lần đồng bộ đầu, khi sổ v3 trên mây còn trống.
function readLegacyRemote(snap){try{const raw=snap.exists()?snap.data().data:null;return raw?validateState(JSON.parse(raw)):null;}catch{return null;}}
function applyRemote(remote){
 state=remote;
 try{localStorage.setItem(STORAGE_KEY,JSON.stringify(remote));memoryOnly=false;corruptRaw=null;}catch{memoryOnly=true;}
 // Không vẽ lại khi đang nhập bài hoặc đang luyện, để không mất thao tác dở.
 if(!dirty&&!(session&&!session.finished)&&!$('#modal').open)({lessons:renderLessons,settings:renderSettings}[page])?.();
}
function onCloudSnapshot(snap){
 if(snap.metadata.hasPendingWrites){setCloud(navigator.onLine?'syncing':'offline');return;}
 // Lần đầu sau đăng nhập phải đợi bản từ máy chủ, tránh ghi đè mây bằng bộ nhớ đệm trống.
 if(!cloud.ready&&snap.metadata.fromCache){setCloud(navigator.onLine?'syncing':'offline');return;}
 // Không ghi đè bản trên mây khi không đọc được: thường là máy này đang chạy bản app cũ.
 let remote;try{remote=readRemote(snap);}catch{setCloud('error','Không đọc được dữ liệu trên mây. Hãy tải lại trang để dùng bản app mới nhất.');return;}
 if(!cloud.ready){
  cloud.ready=true;
  let legacy=false;if(!remote||!remote.lessons.length){const old=readLegacyRemote(snap);if(old&&old.lessons.length){remote=old;legacy=true;}}
  if(!remote||!remote.lessons.length){cloudPush();return;}
  if(!state.lessons.length||JSON.stringify(remote)===JSON.stringify(state)){applyRemote(remote);if(legacy){cloudPush();toast('Đã nạp lại các từ vựng cũ từ tài khoản.');}else setCloud('synced');return;}
  // Lần đầu máy này và mây khác nhau: tự ghép cả hai, không làm mất bài nào.
  if(commit(mergeImportedState(state,remote))){applyRemote(state);toast('Đã ghép dữ liệu máy này với tài khoản.');}
  else{cloud.ready=false;setCloud('error','Chưa ghép được dữ liệu máy này với tài khoản. Hãy tải lại trang.');}
  return;
 }
 if(remote&&JSON.stringify(remote)!==JSON.stringify(state)){applyRemote(remote);toast('Đã cập nhật dữ liệu từ thiết bị khác.');}
 setCloud(snap.metadata.fromCache&&!navigator.onLine?'offline':'synced');
}
function cloudPush(){
 if(!cloud.user||!cloud.ready)return;
 const{fs}=cloud.api;
 fs.setDoc(cloud.ref,{dataV3:JSON.stringify(state),updatedAt:fs.serverTimestamp(),device:deviceId},{merge:true}).catch(error=>{console.error(error);setCloud('error',cloudErrorText(error));});
}
async function cloudSignIn(){
 const{auth,authMod}=cloud.api;const provider=new authMod.GoogleAuthProvider();
 try{await authMod.signInWithPopup(auth,provider);}
 catch(error){
  if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment'].includes(error.code)){try{await authMod.signInWithRedirect(auth,provider);}catch(e){toast(cloudErrorText(e));}}
  else if(!['auth/popup-closed-by-user','auth/cancelled-popup-request'].includes(error.code))toast(cloudErrorText(error));
 }
}
async function cloudSignOut(){
 if(!confirm('Đăng xuất? Dữ liệu vẫn còn trên máy này nhưng sẽ không đồng bộ nữa.'))return;
 await cloud.api.authMod.signOut(cloud.api.auth);toast('Đã đăng xuất.');
}
function renderSyncCard(){
 const card=$('#sync-card');if(!card)return;
 let body;
 if(!FIREBASE_CONFIG)body='<p class="muted">Chưa bật. Dán cấu hình Firebase vào hằng <code>FIREBASE_CONFIG</code> trong <code>index.html</code> theo hướng dẫn <code>SETUP-FIREBASE.md</code>.</p>';
 else if(cloud.status==='loading')body='<p class="muted">Đang tải công cụ đồng bộ…</p>';
 else if(!cloud.user)body='<p class="muted">Đăng nhập cùng một tài khoản Google trên PC và điện thoại để dùng chung bài học. Dữ liệu vẫn được giữ trên máy khi mất mạng.</p>'+(cloud.error?'<p class="mistake tiny">'+esc(cloud.error)+'</p>':'')+(cloud.api?'<button class="primary" id="sync-signin">Đăng nhập bằng Google</button>':'');
 else body='<p>Tài khoản: <strong>'+esc(cloud.user.email||cloud.user.displayName||'')+'</strong><br><span class="muted">Trạng thái: '+esc(saveLabel())+'</span></p>'+(cloud.error?'<p class="mistake tiny">'+esc(cloud.error)+'</p>':'')+'<div class="row">'+'<button id="sync-signout">Đăng xuất</button></div>';
 card.innerHTML='<h2>Đồng bộ PC & điện thoại</h2>'+body;
 $('#sync-signin')?.addEventListener('click',cloudSignIn);$('#sync-signout')?.addEventListener('click',cloudSignOut);
}
